name: test-main-branch
run-name: ${{ github.actor }} is learning GitHub Actions
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-bats-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Compile student.cpp
        run: g++ menu.cpp studentlist.cpp student.cpp -o menu
        
      - name: Show input file
        run: |
          echo "Contents of test1.txt:"
          cat frontend/test1.txt
          
      - name: Run the program
        run: |
           timeout 10 ./menu frontend/test1.txt secondNewTest.txt 
      - name: Show generated files
        run: |
          pwd
          ls -la
          find . -name "secondNewTest.txt"
      - name: Show generated report
        run: |
          cat secondNewTest.txt
