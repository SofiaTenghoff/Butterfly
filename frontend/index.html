<!DOCTYPE html> <!--tells the browswer this is an html webpage-->
<html> <!--tells the browswer everything between these brackets is a webpage-->

  <head> <!--head contains information about the webpage, not what the user actually sees-->
    <title>GradeReportFormatter</title> <!--this is what you'll see in the tab, not in big letters on the page-->
  </head>

  <body> <!--body is what the user actually sees on the page-->
    <h1>Grade Report Formatter</h1> <!--creates a large heading-->
    <p>Upload a grade report to format it!</p>
    <input type = "file"> <!--this creates the Choose File Button on the webpage-->
  </body>
  
</html>
