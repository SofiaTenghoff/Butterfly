<!DOCTYPE html> <!--tells the browswer this is an html webpage-->
<html> <!--tells the browswer everything between these brackets is a webpage-->

  <head> <!--head contains information about the webpage, not what the user actually sees-->
    <title>GradeReportFormatter</title> <!--this is what you'll see in the tab, not in big letters on the page-->
  </head>

  <body> <!--body is what the user actually sees on the page-->
    <h1>Grade Report Formatter</h1> <!--creates a large heading-->
    <p>Upload a grade report to format it!</p>
    <!--the id = "fileInput" part lets Java know what to look for-->
    <input type = "file" id = "fileInput"> <!--this creates the Choose File Button on the webpage-->
    <button id = "processButton">Process File</button> <!--Notice button goes inside body-->
    <!--the script marker tells the browser: the code in here is JavaScript-->
    <script> 
      //browser creates the document object automatically for JavaScript to use--this is part of the language
      const fileInput = document.getElementById("fileInput"); //woohoo we're in Javascript now!
      const processButton = document.getElementById("processButton");
      //addEventListener says: listen for clicks to this button. When the button is clicked, run this code: 
      processButton.addEventListener("click", function() {
        console.log("Process file button was clicked!"); //prints a message to the browser's console
      });
    </script>
  </body>
  
</html>
