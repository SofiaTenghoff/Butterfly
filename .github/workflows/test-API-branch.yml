name: test-main-branch
run-name: ${{ github.actor }} is learning GitHub Actions
on:
  push:
    branches:
      - API.py
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
    -name: set up python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
      - run: python API_Code/FastAPI.py
