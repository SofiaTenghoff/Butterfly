name: test-main-branch
run-name: ${{ github.actor }} is learning GitHub Actions
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-bats-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install g++
        run: sudo apt-get update && sudo apt-get install -y g++

      - name: Compile student.cpp
        run: g++ menu.cpp studentlist.cpp student.cpp -o menu
        
      - name: Show input file
        run: |
          echo "Contents of test1.txt:"
          cat frontend/test1.txt
          
      - name: Check file encoding
        run: |
          xxd -l 16 frontend/test1.txt
          
      - name: Run the program
        run: |
           timeout 10 ./menu frontend/test1.txt secondNewTest.txt 

      - name: Check generated report
        run: |
          test -s secondNewTest.txt
          grep -q "Marvin" secondNewTest.txt
          grep -q "Joe" secondNewTest.txt
          grep -q "Bugs" secondNewTest.txt
          grep -q "Jimmy" secondNewTest.txt
          grep -q "A:      1" secondNewTest.txt
          grep -q "B:      2" secondNewTest.txt
          grep -q "D:      1" secondNewTest.txt
            
      - name: Show generated files
        run: |
          pwd
          ls -la
          find . -name "secondNewTest.txt"
      - name: Show generated report
        run: |
          cat secondNewTest.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Start FastAPI
        run: |
         fastapi dev frontend/FileUploads.py &
          sleep 5

      - name: Test home endpoint
        run: curl --fail http://127.0.0.1:8000/
